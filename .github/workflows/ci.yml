name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun add --global agent-browser@0.26.0

      - run: agent-browser install --with-deps

      - run: bun run build

      - name: Start Bun server
        run: |
          PORT=3000 bun run start > /tmp/alkalye-web.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/app >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/alkalye-web.log
          exit 1

      - run: bun run test:e2e
        env:
          TEST_URL: http://127.0.0.1:3000/app
